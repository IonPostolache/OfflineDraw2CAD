[project]
name = "offlinedraw2cad"
version = "0.1.0"
description = "Turn 2D engineering drawings into editable 3D CAD models, fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "build123d>=0.5",
    "cadquery>=2.4",          # fallback / interop
    "pydantic>=2.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "click>=8.1",             # CLI
    "rich>=13.7",             # pretty terminal output
    "httpx>=0.27",            # talk to LM Studio local server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
offlinedraw2cad = "offlinedraw2cad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]